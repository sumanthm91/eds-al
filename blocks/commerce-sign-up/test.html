<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale Banner</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .banner {
            background-color: #c8102e;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }
        .banner h1 {
            font-size: 36px;
            margin: 0;
            font-weight: bold;
        }
        .banner h2 {
            font-size: 28px;
            margin: 10px 0;
            font-weight: bold;
        }
        .banner p {
            font-size: 18px;
            margin: 5px 0;
        }
        .banner .date {
            font-size: 16px;
        }
        .banner .buttons {
            margin: 20px 0;
        }
        .banner .buttons a {
            background-color: transparent;
            border: 1px solid white;
            color: white;
            padding: 10px 20px;
            margin: 5px;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.3s, color 0.3s;
        }
        .banner .buttons a:hover {
            background-color: white;
            color: #c8102e;
        }
        .banner .offer {
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="banner">
        <h1>Last few days of sale 30%-70% off</h1>
        <h2>Buy 2 get 1 free</h2>
        <p>on all sale items</p>
        <p>Testing the placeholder for Banners and Fragments</p>
        <p class="date">10/03/2024 04:00:10 PM</p>
        <div class="buttons">
            <a href="#">Women</a>
            <a href="#">Men</a>
            <a href="#">Kids</a>
            <a href="#">Repurposed Gems</a>
            <a href="#">Dressing for the metaverse</a>
        </div>
        <p class="offer">Offer valid in store and online until 30.10.2024.</p>
    </div>
</body>
</html>
